<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kian Kheiri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #050505;
            background-image: radial-gradient(circle at 70% 50%, #1a237e 0%, transparent 40%);
            height: 100vh;
            padding-top: 30px;
        }

        #glass-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            height: 70px;
            background: rgba(15, 20, 30, 0.4);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 50px;
            padding: 0 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #2563eb;
            color: white;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-weight: 900;
            font-style: italic;
            font-size: 20px;
        }

        .brand-name {
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .nav-links > li > a {
            display: inline-block;
            text-decoration: none;
            color: #a1a1aa;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-links > li > a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-links > li > a.active {
            color: white;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .icon-btn:hover {
            color: white;
        }
        
        /* اینجا علامت { اضافه شد */
        @media (max-width: 800px) {
            #glass-navbar {
                width: 95%; 
                padding: 0 15px;
            }

            .nav-links {
                display: none; 
            }
        }
    </style>
</head>
<body>
    <header>
        <nav id="glass-navbar">
            <div class="brand">
                <div class="logo-icon">K</div>
                <span class="brand-name">Kian Kheiri</span>
            </div>

            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Projects</a></li>
                <li><a href="#">Articles</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About</a></li>
            </ul>

            <div>
                <button class="icon-btn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </nav>
    </header>
</body>
</html>
